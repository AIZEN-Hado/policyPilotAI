<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · PolicyPilot</title>
  <meta name="description" content="Sign in to the PolicyPilot claims review workspace.">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-panel" aria-labelledby="login-title">
    <a class="login-brand" href="/"><span class="brandmark" aria-hidden="true"><i></i><i></i><i></i></span>PolicyPilot</a>
    <h1 id="login-title">Sign in<span>.</span></h1>
    <p class="subtitle">Open your shared claims workspace.</p>
    <form id="login-form">
      <label>Username<input id="username" name="username" autocomplete="username" maxlength="80" required autofocus></label>
      <label>Password<input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required></label>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button class="primary" id="sign-in" type="submit">Sign in</button>
    </form>
    <p class="small login-note">Use synthetic documents only. Reviewers with this login can access every case in the workspace.</p>
  </main>
</body>
</html>
